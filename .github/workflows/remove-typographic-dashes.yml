name: Remove typographic dash characters

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-typographic-dashes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace em and en dashes in tracked text files
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          replacements = {'\u2014': ' ', '\u2013': '-'}
          files = subprocess.check_output(
              ['git', 'grep', '-IlE', '\u2014|\u2013'], text=True
          ).splitlines()
          for filename in files:
              path = Path(filename)
              try:
                  content = path.read_text(encoding='utf-8-sig')
              except (UnicodeDecodeError, OSError):
                  continue
              for old, new in replacements.items():
                  content = content.replace(old, new)
              path.write_text(content, encoding='utf-8')
          PY

      - name: Commit cleanup and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/remove-typographic-dashes.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove remaining typographic dash characters"
          git push
